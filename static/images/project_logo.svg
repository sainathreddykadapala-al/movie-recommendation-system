<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="860" height="220">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="cardBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#060913" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0.95" />
    </linearGradient>

    <!-- Neon Cyan & Blue Gradients -->
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0070f3" />
    </linearGradient>

    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="badgeBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
    .title-main { font-family: 'Outfit', -apple-system, sans-serif; font-weight: 800; font-size: 38px; fill: url(#cyanNeon); letter-spacing: 2px; }
    .title-sub { font-family: 'Outfit', -apple-system, sans-serif; font-weight: 600; font-size: 14.5px; fill: #e2e8f0; letter-spacing: 3.5px; text-transform: uppercase; }
    .tagline { font-family: 'Inter', -apple-system, sans-serif; font-weight: 400; font-size: 11px; fill: #94a3b8; letter-spacing: 1px; }
    .author-label { font-family: 'Outfit', -apple-system, sans-serif; font-weight: 700; font-size: 10px; fill: #38bdf8; letter-spacing: 2px; text-transform: uppercase; }
    .author-name { font-family: 'Inter', -apple-system, sans-serif; font-weight: 600; font-size: 12px; fill: #ffffff; letter-spacing: 0.5px; }
    .author-role { font-family: 'Inter', -apple-system, sans-serif; font-weight: 400; font-size: 9.5px; fill: #94a3b8; }
  </style>

  <!-- Outer Glass Frame -->
  <rect x="8" y="8" width="844" height="204" rx="22" ry="22" fill="url(#cardBgGrad)" stroke="url(#badgeBorder)" stroke-width="1.6" filter="url(#subtleGlow)" />

  <!-- Corner Ambient Lighting Accents -->
  <circle cx="20" cy="20" r="60" fill="#00f0ff" opacity="0.08" filter="blur(25px)" />
  <circle cx="840" cy="200" r="70" fill="#0070f3" opacity="0.09" filter="blur(30px)" />
  <circle cx="115" cy="110" r="85" fill="#00f0ff" opacity="0.12" filter="blur(35px)" />

  <!-- ========================================================
       CINEMA & MACHINE LEARNING EMBLEM (Left Area: cx ~ 115, cy ~ 110)
       ======================================================== -->
  <g transform="translate(18, 12)">

    <!-- Outer Film Reel Rim -->
    <circle cx="95" cy="98" r="66" fill="#0f172a" stroke="#00f0ff" stroke-width="2.5" filter="url(#subtleGlow)" />
    <circle cx="95" cy="98" r="60" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="8 5" opacity="0.8" />
    <circle cx="95" cy="98" r="44" fill="#0b1120" stroke="#0284c7" stroke-width="1.5" />

    <!-- Film Reel Sprocket Holes -->
    <g fill="#020617" stroke="#00f0ff" stroke-width="1.2">
      <circle cx="95" cy="46" r="6.5" />
      <circle cx="132" cy="61" r="6.5" />
      <circle cx="147" cy="98" r="6.5" />
      <circle cx="132" cy="135" r="6.5" />
      <circle cx="95" cy="150" r="6.5" />
      <circle cx="58" cy="135" r="6.5" />
      <circle cx="43" cy="98" r="6.5" />
      <circle cx="58" cy="61" r="6.5" />
    </g>

    <!-- Angled Clapperboard (Top-Left of Reel) -->
    <g transform="translate(42, 38) rotate(-18)">
      <!-- Clapper Base -->
      <rect x="0" y="10" width="38" height="26" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
      <!-- Clapper Top Stick with Stripes -->
      <rect x="-2" y="0" width="42" height="10" rx="2" fill="#0f172a" stroke="#00f0ff" stroke-width="1.2" />
      <polygon points="4,1 9,1 5,9 0,9" fill="#ffffff" />
      <polygon points="14,1 19,1 15,9 10,9" fill="#00f0ff" />
      <polygon points="24,1 29,1 25,9 20,9" fill="#ffffff" />
      <polygon points="34,1 39,1 35,9 30,9" fill="#00f0ff" />
      <!-- Film Roll Icon on Clapper -->
      <circle cx="19" cy="23" r="6" fill="#0284c7" opacity="0.6" />
      <circle cx="19" cy="23" r="2.5" fill="#ffffff" />
    </g>

    <!-- Machine Learning Glowing Brain Synapse Core (Inside Central Reel) -->
    <g transform="translate(95, 98)" filter="url(#subtleGlow)">
      <!-- Central AI Core Node -->
      <circle cx="0" cy="0" r="9" fill="#00f0ff" />
      <circle cx="0" cy="0" r="14" fill="none" stroke="#00f0ff" stroke-width="1.2" opacity="0.6" stroke-dasharray="3 3" />

      <!-- Synaptic Neural Connectors -->
      <line x1="0" y1="0" x2="-18" y2="-12" stroke="#38bdf8" stroke-width="1.8" />
      <line x1="0" y1="0" x2="18" y2="-12" stroke="#38bdf8" stroke-width="1.8" />
      <line x1="0" y1="0" x2="-22" y2="10" stroke="#38bdf8" stroke-width="1.8" />
      <line x1="0" y1="0" x2="22" y2="10" stroke="#38bdf8" stroke-width="1.8" />
      <line x1="0" y1="0" x2="0" y2="24" stroke="#38bdf8" stroke-width="1.8" />
      <line x1="0" y1="0" x2="0" y2="-22" stroke="#38bdf8" stroke-width="1.8" />

      <line x1="-18" y1="-12" x2="-26" y2="-2" stroke="#00f0ff" stroke-width="1.2" opacity="0.7" />
      <line x1="18" y1="-12" x2="26" y2="-2" stroke="#00f0ff" stroke-width="1.2" opacity="0.7" />
      <line x1="-22" y1="10" x2="-12" y2="22" stroke="#00f0ff" stroke-width="1.2" opacity="0.7" />
      <line x1="22" y1="10" x2="12" y2="22" stroke="#00f0ff" stroke-width="1.2" opacity="0.7" />

      <!-- Synaptic Node Endpoints (Brain Lobes Pattern) -->
      <circle cx="-18" cy="-12" r="4.5" fill="#38bdf8" />
      <circle cx="18" cy="-12" r="4.5" fill="#38bdf8" />
      <circle cx="-22" cy="10" r="4.5" fill="#00f0ff" />
      <circle cx="22" cy="10" r="4.5" fill="#00f0ff" />
      <circle cx="0" cy="24" r="4" fill="#38bdf8" />
      <circle cx="0" cy="-22" r="4" fill="#00f0ff" />
      <circle cx="-26" cy="-2" r="3" fill="#ffffff" />
      <circle cx="26" cy="-2" r="3" fill="#ffffff" />
      <circle cx="-12" cy="22" r="3" fill="#ffffff" />
      <circle cx="12" cy="22" r="3" fill="#ffffff" />
    </g>

    <!-- Glowing Sparkle / Star Elements -->
    <path d="M 160 52 Q 160 62 170 62 Q 160 62 160 72 Q 160 62 150 62 Q 160 62 160 52 Z" fill="#00f0ff" opacity="0.9" filter="url(#subtleGlow)" />
    <path d="M 36 142 Q 36 148 42 148 Q 36 148 36 154 Q 36 148 30 148 Q 36 148 36 142 Z" fill="#38bdf8" opacity="0.7" />
  </g>

  <!-- ========================================================
       PROJECT TITLES & METADATA (Center-Right Area)
       ======================================================== -->
  <g transform="translate(210, 24)">
    
    <!-- Top Micro Badge -->
    <g transform="translate(0, 8)">
      <rect x="0" y="0" width="168" height="20" rx="10" fill="rgba(0, 240, 255, 0.12)" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1" />
      <circle cx="10" cy="10" r="3.5" fill="#00f0ff" filter="url(#subtleGlow)" />
      <text x="20" y="14" class="author-label" font-size="9px">MACHINE LEARNING</text>
      <text x="118" y="14" class="author-label" fill="#fcd34d" font-size="9px">• ACADEMIC</text>
    </g>

    <!-- Main Project Branding -->
    <text x="0" y="60" class="title-main" filter="url(#subtleGlow)">CINEMATCH AI</text>
    <text x="0" y="82" class="title-sub">MOVIE RECOMMENDATION SYSTEM</text>
    <text x="0" y="100" class="tagline">TF-IDF Feature Engineering &amp; K-Means Clustering &amp; High-Dimensional Cosine Similarity</text>

    <!-- Divider Line -->
    <line x1="0" y1="112" x2="620" y2="112" stroke="rgba(148, 163, 184, 0.22)" stroke-width="1" />

    <!-- ========================================================
         TEAM MEMBERS SECTION (All 3 Names Prominently Featured)
         ======================================================== -->
    <g transform="translate(0, 122)">
      <text x="0" y="12" class="author-label">PROJECT TEAM MEMBERS</text>

      <!-- Member 1: K. Sainath Reddy -->
      <g transform="translate(0, 22)">
        <rect x="0" y="0" width="195" height="38" rx="10" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(0, 240, 255, 0.35)" stroke-width="1" />
        <!-- Avatar Icon -->
        <circle cx="19" cy="19" r="12" fill="#0284c7" opacity="0.3" />
        <circle cx="19" cy="15" r="4.5" fill="#00f0ff" />
        <path d="M 11 25 A 8 6 0 0 1 27 25 Z" fill="#00f0ff" />
        <!-- Name & ID -->
        <text x="38" y="17" class="author-name">K. Sainath Reddy</text>
        <text x="38" y="30" class="author-role">241U1R1030 • Lead ML / Fullstack</text>
      </g>

      <!-- Member 2: K. Sarayu Reddy -->
      <g transform="translate(208, 22)">
        <rect x="0" y="0" width="195" height="38" rx="10" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
        <!-- Avatar Icon -->
        <circle cx="19" cy="19" r="12" fill="#0284c7" opacity="0.3" />
        <circle cx="19" cy="15" r="4.5" fill="#38bdf8" />
        <path d="M 11 25 A 8 6 0 0 1 27 25 Z" fill="#38bdf8" />
        <!-- Name & ID -->
        <text x="38" y="17" class="author-name">K. Sarayu Reddy</text>
        <text x="38" y="30" class="author-role">241U1R1029 • Data Architecture</text>
      </g>

      <!-- Member 3: S. Surya Teja -->
      <g transform="translate(416, 22)">
        <rect x="0" y="0" width="195" height="38" rx="10" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(0, 240, 255, 0.35)" stroke-width="1" />
        <!-- Avatar Icon -->
        <circle cx="19" cy="19" r="12" fill="#0284c7" opacity="0.3" />
        <circle cx="19" cy="15" r="4.5" fill="#00f0ff" />
        <path d="M 11 25 A 8 6 0 0 1 27 25 Z" fill="#00f0ff" />
        <!-- Name & ID -->
        <text x="38" y="17" class="author-name">S. Surya Teja</text>
        <text x="38" y="30" class="author-role">Team Member • Research &amp; UI</text>
      </g>
    </g>

  </g>
</svg>

